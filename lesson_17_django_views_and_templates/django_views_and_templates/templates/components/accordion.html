{% load custom_filters %}

<div class="container-fluid">
    {% with accordion_id|random_id as id %}
        <div class="accordion" id="{{ id }}">
            {% for item in items %}
                <div class="accordion-item">
                    <h2 class="accordion-header" id="header-{{ id }}{{ forloop.counter }}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                aria-expanded="false"
                                data-bs-target="#{{ id }}{{ forloop.counter }}"
                                aria-controls="{{ id }}{{ forloop.counter }}">
                            <span class="text-uppercase fw-bold">{{ item.title }}</span>
                        </button>
                    </h2>
                    <div id="{{ id }}{{ forloop.counter }}" class="accordion-collapse collapse"
                         aria-labelledby="header-{{ id }}{{ forloop.counter }}"
                         data-bs-parent="#{{ id }}">
                        <div class="accordion-body">
                            {{ item.content }}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endwith %}
</div>
